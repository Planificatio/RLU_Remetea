<!doctype html>
<html lang="en">
    <head>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        
        .leaflet-control-zoom a {
            background-color: white !important;
            color: #2E2E2E !important;
            border-radius: 2px !important;
        }
        
        .leaflet-control-zoom a:hover {
            background-color: #f4f4f4 !important;
        }
        
        .leaflet-control-locate a {
            background-color: white !important;
            color: #2E2E2E !important;
            border-radius: 2px !important;
        }

        .leaflet-control-locate a:hover {
            background-color: #f4f4f4 !important;
        }
        
        .language-widget {
            position: absolute !important;
            top: 10px;
            right: 10px;
            background: white;
            border-radius: 2px;
            display: flex;
            align-items: center;
            padding: 5px;
            z-index: 1001 !important;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
        }

        .language-icon {
            width: 30px;
            height: 20px;
            cursor: pointer;
            margin: 0 3px;
            transition: all 0.1s ease;
        }

        .language-icon.selected {
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        .language-icon.unselected {
            opacity: 0.8;
            transform: scale(0.9);
            filter: brightness(0.9);
        }
        
        .language-icon.unselected:hover {
            transform: scale(1.0);
            opacity: 0.9;
            filter: brightness(1.0);
        }
        
        .leaflet-top.leaflet-right .leaflet-control-layers {
            margin-top: 50px;
        }
        
        #demo-widget {
            position: fixed;
            bottom: 80px;
            right: 13px;
            background: white;
            padding: 5px;
            border-radius: 2px;
            z-index: 1000;
            overflow: hidden;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
        }

        #demo-widget:hover {
            width: 120px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 4px;
            padding: 0;
        }
        
        #demo-icon {
            width: 24px;
            height: 24px;
        }

        #show-demo-btn {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
            background-color: white;
            color: black;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        #demo-widget:hover #show-demo-btn {
            display: flex;
        }
        
        #demo-widget:hover #demo-icon {
            display: none;
        }

        .demo-textbox {
            position: absolute;
            padding: 10px;
            background: rgba(255, 255, 255, 1);
            border: 0px solid #ccc;
            border-radius: 2px;
            z-index: 1001;
            width: 75%;
            max-width: 600px;
            max-height: 70%;
            left: 50%;
            top: 30%;
            transform: translate(-50%, -30%);
            font-size: 15px;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
        }
        
        #map.darkened {
            position: relative;
        }

        #map.darkened::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 999;
            pointer-events: none;
        }
        
        .widget {
            transition: background-color 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
        }

        .widget-darkened {
            opacity: 0.2;
        }

        .widget-highlight {
            z-index: 1001;
            background-color: rgba(255, 255, 255, 1.0);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            opacity: 1.0;
        }
        
        #demo-nav {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            z-index: 1002;
        }
        
        .nav-btn, .end-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc;
            border-radius: 4px;
            margin: 0 5px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 18px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover, .end-btn:hover {
            background: rgba(240, 240, 240, 0.9);
        }

        .nav-btn {
            margin: 0;
            background: white;
        }
        
        .nav-btn-disabled {
            pointer-events: none;
            opacity: 0.5;
            cursor: default;
        }
        
        .end-btn {
            margin-left: 20px;
            background: rgba(255, 0, 0, 1);
            color: white;
        }
        
        .measurement-box {
            position: absolute;
            top: 155px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            font-size: 15px;
            z-index: 1000;
            font-family: Arial, sans-serif; 
            width: auto;
            max-width: 250px; 
            height: auto;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }
        
        .leaflet-popup-close-button {
            color: red !important;
            font-size: 23px !important;
            font-weight: bold;
            top: 6px;
            right: 10px;
            text-shadow: none;
            opacity: 1 !important;
        }
        
        .leaflet-popup-close-button:hover {
            color: darkred !important;
            cursor: pointer;
        }
        </style>

        <title>RLU - Remetea</title>
    </head>
    <body>
        <div id="map" style="z-index:1;">
            <div class="language-widget widget" id="language-widget">
                <img src="images/ro.png" class="language-icon" id="romanian-flag" title="Română" />
                <img src="images/hu.png" class="language-icon" id="hungarian-flag" title="Magyar" />

            <div id="demo-widget" class="widget">
                <img id="demo-icon" src="images/demo/demo-icon.svg" alt="Demo Icon">
                <button id="show-demo-btn">Útmutató megtekintése</button>
            </div>
            <div id="demo-nav" style="display:none;">
                <button id="prev-btn" class="nav-btn">
                    <span style="font-size: 24px;">&#9664;</span>

                <button id="next-btn" class="nav-btn">

                    <span style="font-size: 24px;">&#10006;</span>
                </button>
            </div>
            <div id="logo">
                <a href="https://www.rendezesiterv.eu/" target="_blank">

        <script>
        // --- Basic map and highlight logic ---
        var highlightLayer;
        var currentOpacity = 1;

        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
                highlightLayer.setStyle({
                    color: 'rgba(0,255,242,' + currentOpacity + ')'
                });
            } else {
                highlightLayer.setStyle({
                    fillColor: 'rgba(0,255,242,' + currentOpacity + ')',
                    fillOpacity: currentOpacity,
                    color: getBorderColorByType(e.target.feature.properties['Tip_SZF']),
                    weight: 1,
                    opacity: currentOpacity
                });
            }
        }

        function resetHighlight(e) {
            var layer = e.target;
            layer.setStyle(style_RLU_0_0(layer.feature));
        }

        var map = L.map('map', {
            zoomControl: false,
            maxZoom: 23,
            minZoom: 11,
            keyboard: false
        }).setView([46.803343869363886, 25.391041016310496], 13);

        // SVG pattern definitions on first layer add
        map.on('layeradd', function () {
            const svg = document.querySelector('svg');
            if (!svg) return;

            const defs = document.createElementNS("http://www.w3.org/2000/svg", 'defs');
            let shouldAppend = false;

            // Orange-yellow striped pattern
            if (!document.getElementById('orangeYellowStripes')) {
                defs.innerHTML += `
                    <pattern id="orangeYellowStripes" patternUnits="userSpaceOnUse" width="12" height="12">
                        <rect x="0" y="0" width="6" height="12" fill="rgba(248,164,5,1.0)" />
                        <rect x="6" y="0" width="6" height="12" fill="rgba(253,242,7,1.0)" />
                    </pattern>`;
                shouldAppend = true;
            }

            // Green stripes
            if (!document.getElementById('greenStripes')) {
                defs.innerHTML += `
                    <pattern id="greenStripes" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(-45)">
                        <rect x="0" y="0" width="2" height="12" fill="rgba(15,210,20,1.0)" />
                        <rect x="6" y="0" width="6" height="12" fill="rgba(237,253, 168,0)" />
                    </pattern>`;
                shouldAppend = true;
            }
			
			// greenVertical
			if (!document.getElementById('greenStripes')) {
                defs.innerHTML += `
                    <pattern id="greenVertical" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(0)">
                        <rect x="0" y="0" width="2" height="12" fill="rgba(15,210,20,1.0)" />
                        <rect x="6" y="0" width="6" height="12" fill="rgba(237,253, 168,0)" />
                    </pattern>`;
                shouldAppend = true;
            }
            
            // Green 2 stripes
            if (!document.getElementById('green2Stripes')) {
                defs.innerHTML += `
                    <pattern id="green2Stripes" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(0)">
                        <rect x="0" y="0" width="6" height="12" fill="rgba(56,151,20,1.0)" />
                        <rect x="6" y="0" width="6" height="12" fill="rgba(237,253,168,1.0)" />
                    </pattern>`;
                shouldAppend = true;
            }

            // Blue stripes
            if (!document.getElementById('blueStripes')) {
                defs.innerHTML += `
                    <pattern id="blueStripes" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
                        <rect x="0" y="0" width="2" height="12" fill="rgba(15,210,20,1.0)" />
                        <rect x="6" y="0" width="6" height="12" fill="rgba(220,82,90,0)" />
                    </pattern>`;
                shouldAppend = true;
            }
            
            // Orange-black striped pattern (if needed later)
            if (!document.getElementById('orangeBlackStripes')) {
                defs.innerHTML += `
                    <pattern id="orangeBlackStripes" patternUnits="userSpaceOnUse" width="12" height="12">
                        <rect x="0" y="0" width="6" height="12" fill="rgba(255,107,1,0.4)" />
                        <rect x="6" y="0" width="6" height="12" fill="rgba(0,0,0,1.0)" />
                    </pattern>`;
                shouldAppend = true;
            }

            if (shouldAppend) {
                svg.insertBefore(defs, svg.firstChild);
            }
        });

        map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank">Leaflet</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        setTimeout(function() {
            map.invalidateSize();
        }, 500);

        // --- Popup helpers ---
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            if (tempDiv.querySelector('td img')) {
                popup._contentNode.classList.add('media');
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        // --- Title control ---
        var title = new L.Control({position:'topleft'});
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info widget');
            this._div.style.zIndex = 999;
            this.update('hu');
            return this._div;
        };
        title.update = function (lang) {
            var text = lang === 'hu'
                ? 'Helyi Építésügyi Szabályzat<br>Gyergyóremete Község'
                : 'Regulament Local de Urbanism<br> Comuna Remetea';
            this._div.innerHTML = `
                <div style="display: flex; align-items: center;">
                    <a href="https://www.gyergyoremete.ro/" target="_blank">
                        <img class="titleimage" src="images/logo_remete.png" height="62" width="43" style="margin-right: 10px;">
                    </a>
                    <h2 style="color: black; line-height: 1.3; margin: 0; font-family: Calibri, sans-serif; font-size: 24px;">
                        ${text}
                    </h2>
                </div>`;
        };
        title.addTo(map);

        var zoomControl = L.control.zoom({position: 'topleft'}).addTo(map);
        zoomControl.getContainer().classList.add('widget');
        zoomControl.getContainer().id = 'zoom-widget';

        var fullscreenControl = L.control.fullscreen({
            position: 'topleft',
            title: 'Teljes képernyő',
            titleCancel: 'Kilépés teljes képernyőből',
            forceSeparateButton: false
        }).addTo(map);
        fullscreenControl.getContainer().classList.add('widget');
        fullscreenControl.getContainer().id = 'fullscreen-widget';

        // Geoman controls
        map.pm.addControls({
            position: 'topleft',
            drawCircleMarker: false,
            drawRectangle: false,
            rotateMode: false
        });

        // Tag toolbars and buttons as widgets for demo
        var drawingToolbar = document.querySelectorAll('.leaflet-pm-toolbar')[0];
        if (drawingToolbar) {
            drawingToolbar.id = 'drawing-widget';
            drawingToolbar.classList.add('widget');
        }
        var firstButton = drawingToolbar && drawingToolbar.querySelectorAll('.leaflet-pm-btn')[0];
        if (firstButton) {
            firstButton.id = 'first-button';
            firstButton.classList.add('widget');
        }
        var polylineButton = document.querySelector('.leaflet-pm-icon-polyline');
        if (polylineButton) {
            polylineButton.id = 'polyline-button';
            polylineButton.classList.add('widget');
        }
        var polygonButton = document.querySelector('.leaflet-pm-icon-polygon');
        if (polygonButton) {
            polygonButton.id = 'polygon-button';
            polygonButton.classList.add('widget');
        }
        var circleButton = document.querySelector('.leaflet-pm-icon-circle');
        if (circleButton) {
            circleButton.id = 'circle-button';
            circleButton.classList.add('widget');
        }
        var textButton = document.querySelector('.leaflet-pm-icon-text');
        if (textButton) {
            textButton.id = 'text-button';
            textButton.classList.add('widget');
        }
        var editingToolbar = document.querySelectorAll('.leaflet-pm-toolbar')[1];
        if (editingToolbar) {
            editingToolbar.id = 'editing-widget';
            editingToolbar.classList.add('widget');
        }
        var selectButton = document.querySelector('.leaflet-pm-icon-select');
        if (selectButton) {
            selectButton.id = 'select-button';
            selectButton.classList.add('widget');
        }
        var moveButton = document.querySelector('.leaflet-pm-icon-move');
        if (moveButton) {
            moveButton.id = 'move-button';
            moveButton.classList.add('widget');
        }
        var cutButton = document.querySelector('.leaflet-pm-icon-cut');
        if (cutButton) {
            cutButton.id = 'cut-button';
            cutButton.classList.add('widget');
        }
        var deleteButton = document.querySelector('.leaflet-pm-icon-delete');
        if (deleteButton) {
            deleteButton.id = 'delete-button';
            deleteButton.classList.add('widget');
        }

        // --- Language switching ---
        function changeLanguage(lang) {
            console.log('Changing language to:', lang);
            map.pm.setLang(lang);
            L.PM.activeLang = lang;
            updateLegendLanguage(lang);

            // Refresh RLU popups if open
            map.eachLayer(function(layer) {
                if (layer.feature && layer.feature.properties && layer.getPopup && layer.getPopup()) {
                    layer.closePopup();

                    if (layer.feature.properties['Tip_SZF'] !== undefined) {
                        var content = pop_RLU_0(layer.feature, layer);
                        layer.bindPopup(content, {maxHeight: 400});
                    }
                }
            });

            if (lang === 'ro') {
                zoomControl._zoomInButton.title = 'Mărire';
                zoomControl._zoomOutButton.title = 'Micșorare';

                const fullscreenButton = document.querySelector('.leaflet-control-fullscreen-button');
                if (fullscreenButton) fullscreenButton.title = 'Ecran complet';

                const fullscreenCancelButton = document.querySelector('.leaflet-control-fullscreen-button.leaflet-fullscreen-on');
                if (fullscreenCancelButton) fullscreenCancelButton.title = 'Ieșire din ecran complet';

                const locateButton = document.querySelector('.leaflet-control-locate a');
                if (locateButton) locateButton.title = 'Locația curentă';

                const printButton = document.querySelector('.leaflet-browser-print');
                if (printButton) printButton.title = 'Imprimare';
            } else {
                zoomControl._zoomInButton.title = 'Nagyítás';
                zoomControl._zoomOutButton.title = 'Kicsinyítés';

                const fullscreenButton = document.querySelector('.leaflet-control-fullscreen-button');
                if (fullscreenButton) fullscreenButton.title = 'Teljes képernyő';

                const fullscreenCancelButton = document.querySelector('.leaflet-control-fullscreen-button.leaflet-fullscreen-on');
                if (fullscreenCancelButton) fullscreenCancelButton.title = 'Kilépés teljes képernyőből';

                const locateButton = document.querySelector('.leaflet-control-locate a');
                if (locateButton) locateButton.title = 'Élő helyzet';

                const printButton = document.querySelector('.leaflet-browser-print');
                if (printButton) printButton.title = 'Nyomtatás';
            }
        }

        // Measurement UI
        var measurementBox = L.DomUtil.create('div', 'measurement-box', document.body);
        var vertexMarkers = [];
        var activeLayer = null;
        document.getElementById('map').appendChild(measurementBox);

        map.on('click', function(event) {
            let isInteractiveLayerClicked = event.originalEvent.target.closest('.leaflet-interactive');
            if (!isInteractiveLayerClicked && activeLayer) {
                hideMeasurements();
            }
        });

        function hideMeasurements() {
            measurementBox.style.display = 'none';
            vertexMarkers.forEach(marker => map.removeLayer(marker));
            vertexMarkers = [];
            activeLayer = null;
        }

        function updateMeasurementBox(layer) {
            let content = '<strong>Méretek:</strong><br>';
            vertexMarkers.forEach(marker => map.removeLayer(marker));
            vertexMarkers = [];
            let totalDistance = 0;

            if (layer instanceof L.Polygon) {
                let latlngs = layer.getLatLngs()[0];

                let coordinates = latlngs.map(latlng => [latlng.lng, latlng.lat]);
                if (coordinates[0][0] !== coordinates[coordinates.length - 1][0] ||
                    coordinates[0][1] !== coordinates[coordinates.length - 1][1]) {
                    coordinates.push(coordinates[0]);
                }

                let polygon = turf.polygon([coordinates]);
                let area = turf.area(polygon);

                for (let i = 0; i < latlngs.length; i++) {
                    if (i > 0) {
                        let distance = latlngs[i - 1].distanceTo(latlngs[i]);
                        content += `${i}. szegmens: ${distance.toFixed(2)} m<br>`;
                        totalDistance += distance;
                    }
                    let marker = L.marker(latlngs[i], {
                        icon: L.divIcon({
                            className: 'vertex-label',
                            html: `<div style="background-color: white; border: 2px solid #3388ff; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;">${i + 1}</div>`,
                            iconSize: [18, 18],
                            iconAnchor: [9, 9]
                        }),
                        interactive: false
                    }).addTo(map);
                    vertexMarkers.push(marker);
                }

                let closingDistance = latlngs[latlngs.length - 1].distanceTo(latlngs[0]);
                totalDistance += closingDistance;
                content += `Utolsó szegmens: ${closingDistance.toFixed(2)} m<br>`;

                content += `<strong>Felület:</strong> ${area.toFixed(2)} m² (${(area / 10000).toFixed(2)} ha)<br>`;
                content += `<strong>Kerület:</strong> ${totalDistance.toFixed(2)} m<br>`;
            } else if (layer instanceof L.Polyline) {
                let latlngs = layer.getLatLngs();
                for (let i = 0; i < latlngs.length; i++) {
                    if (i > 0) {

        function leafletPipInside(polygonLayer, latlng) {
            const point = [latlng.lat, latlng.lng];
            const latlngs = polygonLayer.getLatLngs();

            function isInsideRing(ring) {
                let inside = false;
                for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                    const xi = ring[i].lat, yi = ring[i].lng;
                    const xj = ring[j].lat, yj = ring[j].lng;

                    const intersect = ((yi > point[1]) !== (yj > point[1])) &&
                        (point[0] < (xj - xi) * (point[1] - yi) / (yj - yi + 0.0000001) + xi);
                    if (intersect) inside = !inside;
                }
                return inside;
            }

            if (Array.isArray(latlngs[0][0])) {
                return latlngs.some(polygon => isInsideRing(polygon[0]));
            } else {
                return isInsideRing(latlngs[0] || latlngs);
            }
        }

            };

        function updateLegendLanguage(lang) {
            const legendItems = document.querySelectorAll('.leaflet-control-layers-overlays label, .leaflet-control-layers-overlays td, .leaflet-control-layers-overlays strong');

            legendItems.forEach(item => {
                const labelRo = item.getAttribute('data-label-ro');
                const labelHu = item.getAttribute('data-label-hu');

                if (lang === 'ro' && labelRo) {
                    item.innerHTML = labelRo;
                } else if (lang === 'hu' && labelHu) {
                    item.innerHTML = labelHu;
                }
            });

            const sliderLabel = document.querySelector('label[for="opacitySlider"]');
            if (sliderLabel) {
                if (lang === 'ro') {
                    sliderLabel.innerText = sliderLabel.getAttribute('data-label-ro');
                } else if (lang === 'hu') {
                    sliderLabel.innerText = sliderLabel.getAttribute('data-label-hu');
                }
            }
        }

            var button = document.getElementById('show-demo-btn');
            if (lang === 'ro') {

        const demoSteps = [
            {
                id: 0,
                targetId: 'layers-widget',
                hu: '<h3>Rétegek kezelése</h3><p>Itt kapcsolhatja ki és be az egyes térképi rétegeket, például a közigazgatási határt, belterületet és az RLU övezeteket.</p>',

                targetId: 'measurement-box',
                hu: '<h3>Mérési eredmények</h3><p>Az itt megjelenő doboz mutatja az egyes szegmensek hosszát, a poligon felületét és kerületét.</p>',
                ro: '<h3>Rezultatele măsurătorilor</h3><p>Aici sunt afișate lungimile segmentelor, suprafața și perimetrul poligonului.</p>'
            },
            {
                id: 3,
                targetId: 'zoom-widget',
                hu: '<h3>Nagyítás és kicsinyítés</h3><p>A klasszikus zoom gombokkal közelíthet vagy távolíthat a térképen.</p>',
                ro: '<h3>Zoom</h3><p>Cu butoanele de zoom puteți mări sau micșora harta.</p>'
            }
        ];

        let currentStep = 0;
        let activeTextbox = null;

        function getActiveLang() {
            return L.PM && L.PM.activeLang ? L.PM.activeLang : 'hu';
        }

        function clearDemoHighlight() {
            document.getElementById('map').classList.remove('darkened');
            document.querySelectorAll('.widget').forEach(el => {
                el.classList.remove('widget-darkened');
                el.classList.remove('widget-highlight');
            });
        }

        function showStep(index) {
            if (index < 0 || index >= demoSteps.length) return;
            currentStep = index;

            if (activeTextbox && activeTextbox.parentNode) {
                activeTextbox.parentNode.removeChild(activeTextbox);
                activeTextbox = null;
            }

            clearDemoHighlight();
            const step = demoSteps[index];
            const lang = getActiveLang();
            const target = step.targetId ? document.getElementById(step.targetId) : null;

            document.getElementById('map').classList.add('darkened');
            document.querySelectorAll('.widget').forEach(el => {
                el.classList.add('widget-darkened');
            });

            if (target) {
                target.classList.remove('widget-darkened');
                target.classList.add('widget-highlight');
            }

            const textbox = document.createElement('div');
            textbox.className = 'demo-textbox';
            textbox.innerHTML = lang === 'ro' ? step.ro : step.hu;
            document.body.appendChild(textbox);
            activeTextbox = textbox;

            document.getElementById('prev-btn').classList.toggle('nav-btn-disabled', currentStep === 0);
            document.getElementById('next-btn').classList.toggle('nav-btn-disabled', currentStep === demoSteps.length - 1);
        }

        function endDemo() {
            if (activeTextbox && activeTextbox.parentNode) {
                activeTextbox.parentNode.removeChild(activeTextbox);
                activeTextbox = null;
            }
            clearDemoHighlight();
            document.getElementById('demo-nav').style.display = 'none';
        }

        function startDemo() {
            document.getElementById('demo-nav').style.display = 'flex';
            showStep(0);
        }

        document.getElementById('show-demo-btn').addEventListener('click', startDemo);
        document.getElementById('prev-btn').addEventListener('click', function() {
            if (currentStep > 0) showStep(currentStep - 1);
        });
        document.getElementById('next-btn').addEventListener('click', function() {
            if (currentStep < demoSteps.length - 1) showStep(currentStep + 1);
        });
        document.getElementById('end-btn').addEventListener('click', endDemo);

        // If language changes while demo is open, re-render current step
        function maybeRefreshDemoOnLangChange() {
            if (document.getElementById('demo-nav').style.display !== 'none' && activeTextbox) {
                showStep(currentStep);
            }
        }

        const oldChangeLanguage = changeLanguage;
        changeLanguage = function(lang) {
            oldChangeLanguage(lang);
            maybeRefreshDemoOnLangChange();
        };
        </script>
